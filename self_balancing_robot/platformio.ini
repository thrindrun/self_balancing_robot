; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; İşlemci hızı (240MHz)
board_build.f_cpu = 240000000L

; Seri port hızı (Kodunuzdaki Serial.begin hızıyla aynı olmalı)
monitor_speed = 115200

; CH341 sürücüsü bazen yükleme hızında seçici olabilir, sorun yaşarsanız 460800'e düşürebilirsiniz
upload_speed = 921600

; Eğer birden fazla cihaz bağlıysa portu sabitleyebilirsiniz (Örnek: COM3 veya /dev/ttyUSB0)
; upload_port = COMx

lib_deps =
    electroniccats/MPU6050
    i2cdevlib-core
    h2zero/NimBLE-Arduino @ ^1.4.1